name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check demo data is up to date
        working-directory: .
        run: |
          python3 science/generate_demo_mission.py
          git diff --exit-code android/app/src/main/assets/demo_mission.json
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crewpulse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CrewPulse-${GITHUB_REF_NAME}.apk
          gh release create "$GITHUB_REF_NAME" "CrewPulse-${GITHUB_REF_NAME}.apk" --title "CrewPulse $GITHUB_REF_NAME" --notes "Hackathon build. Demo data is synthetic."
